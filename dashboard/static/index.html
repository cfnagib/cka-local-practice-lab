<!doctype html>
<html><head><meta charset="utf-8"><title>CKA Local Practice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
body{margin:0;background:#101318;color:#e8eaed;font:14px system-ui}header{height:54px;background:#191d24;display:flex;align-items:center;gap:14px;padding:0 20px}h1{font-size:18px}#timer{margin-left:auto;font:24px monospace;color:#7dd3fc}main{height:calc(100vh - 54px);display:flex;flex-direction:column}section{padding:18px 24px;overflow:auto;box-sizing:border-box}section:first-child{height:42%;min-height:220px}section:last-child{height:58%;padding-top:0}#question{white-space:pre-wrap;line-height:1.55;background:#171b22;padding:18px;border-radius:8px}#term{background:#050607;height:100%;box-sizing:border-box;padding:10px}button,select{background:#2563eb;color:white;border:0;border-radius:5px;padding:9px 13px;cursor:pointer}button.secondary{background:#374151}#status{color:#9ca3af;margin:8px 0}
</style></head>
<body><header><h1>CKA Local Practice</h1><button class="secondary" onclick="previous()">← Previous</button><select id="q"></select><button class="secondary" onclick="next()">Next →</button><button onclick="start()">Start / Reset</button><button class="secondary" onclick="validate()">Validate</button><button class="secondary" onclick="hint()">Hint</button><span id="timer">00:00:00</span></header>
<main><section><h2>Question</h2><div id="status">Preparing Question 1…</div><div id="question"></div></section><section><div id="term"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script>
let ws,started=false,seconds=0; const q=document.querySelector('#q'),text=document.querySelector('#question'),status=document.querySelector('#status');
const terminal=new Terminal({cursorBlink:true,fontSize:14,theme:{background:'#050607',foreground:'#e8eaed'}});terminal.open(document.querySelector('#term'));
for(let i=1;i<=17;i++)q.add(new Option('Question '+i,i));
async function load(){const r=await fetch('/api/question/'+q.value);const d=await r.json();text.textContent=d.text}
function previous(){if(+q.value>1){q.value=+q.value-1;start()}}
function next(){if(+q.value<17){q.value=+q.value+1;start()}}
async function start(){if(ws)ws.close();started=false;seconds=0;await load();terminal.reset();terminal.writeln('Resetting lab and preparing question…');status.textContent='Preparing environment…';const r=await fetch('/api/start/'+q.value,{method:'POST'}),d=await r.json();if(!d.ok){terminal.write(d.output);status.textContent='Preparation failed';return}started=true;status.textContent='Solve independently. Use Validate after you finish.';ws=new WebSocket('ws://'+location.hostname+':8791');ws.onmessage=e=>terminal.write(e.data);ws.onopen=()=>terminal.focus();ws.onclose=()=>terminal.writeln('\r\nTerminal session ended.');}
terminal.onData(data=>{if(ws&&ws.readyState===1)ws.send(data)});
function validate(){alert('Validation will be connected to the UI next. The terminal is now fully interactive.')}function hint(){alert('Use the question wording and documentation first. Hints remain progressive by design.')}
setInterval(()=>{if(started){seconds++;const h=String(seconds/3600|0).padStart(2,'0'),m=String(seconds/60%60|0).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.querySelector('#timer').textContent=`${h}:${m}:${s}`}},1000);start();
</script></body></html>
