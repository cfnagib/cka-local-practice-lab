<!doctype html><html><head><meta charset="utf-8"><title>CKA Local Practice</title>
<style>body{margin:0;background:#101318;color:#e8eaed;font:14px system-ui}header{height:54px;background:#191d24;display:flex;align-items:center;gap:18px;padding:0 20px}h1{font-size:18px}#timer{margin-left:auto;font:24px monospace;color:#7dd3fc}main{display:grid;grid-template-columns:42% 58%;height:calc(100vh - 54px)}section{padding:24px;overflow:auto}#question{white-space:pre-wrap;line-height:1.55;background:#171b22;padding:18px;border-radius:8px}#term{background:#050607;padding:14px;font:14px monospace;white-space:pre-wrap;overflow:auto;height:calc(100% - 28px);box-sizing:border-box;outline:none}button,select{background:#2563eb;color:white;border:0;border-radius:5px;padding:9px 13px;margin:3px;cursor:pointer}button.secondary{background:#374151}#status{color:#9ca3af;margin:8px 0}</style></head>
<body><header><h1>CKA Local Practice</h1><select id="q"></select><button onclick="start()">Start / Reset</button><button class="secondary" onclick="validate()">Validate</button><button class="secondary" onclick="hint()">Hint</button><span id="timer">00:00:00</span></header>
<main><section><h2>Question</h2><div id="status">Choose a question and press Start.</div><div id="question"></div></section><section><div id="term" tabindex="0">Terminal is not started.</div></section></main>
<script>let ws,started,seconds=0;const q=document.querySelector('#q'),text=document.querySelector('#question'),term=document.querySelector('#term');for(let i=1;i<=17;i++)q.add(new Option('Question '+i,i));async function load(){let x=await fetch('/api/question/'+q.value);let d=await x.json();text.textContent=d.text}async function start(){started=false;seconds=0;await load();term.textContent='Resetting lab and preparing question...\n';document.querySelector('#status').textContent='Preparing...';let r=await fetch('/api/start/'+q.value,{method:'POST'}),d=await r.json();term.textContent=d.output;if(!d.ok){document.querySelector('#status').textContent='Preparation failed';return}started=true;document.querySelector('#status').textContent='Solve independently. Use Validate after you finish.';ws=new WebSocket('ws://'+location.hostname+':8791');ws.onmessage=e=>{term.textContent+=e.data;term.scrollTop=term.scrollHeight};ws.onopen=()=>term.focus();term.onkeydown=e=>{if(ws&&ws.readyState===1){e.preventDefault();ws.send(e.key==='Enter'?'\r':e.key==='Backspace'?'\x7f':e.key.length===1?e.key:'')}}}function validate(){alert('Validation is connected to the CLI workflow in this first UI version. Run validate-question.sh after exiting the terminal.')}function hint(){alert('Use the question wording and the allowed Kubernetes/Helm documentation. Solutions are intentionally not shown automatically.')}setInterval(()=>{if(started){seconds++;let h=String(seconds/3600|0).padStart(2,'0'),m=String(seconds/60%60|0).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.querySelector('#timer').textContent=`${h}:${m}:${s}`}},1000);load()</script></body></html>
