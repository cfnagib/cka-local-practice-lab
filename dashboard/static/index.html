<!doctype html>
<html><head><meta charset="utf-8"><title>CKA Local Practice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
body{margin:0;background:#101318;color:#e8eaed;font:14px system-ui}header{height:54px;background:#191d24;display:flex;align-items:center;gap:14px;padding:0 20px}h1{font-size:18px}#timer{margin-left:auto;font:24px monospace;color:#7dd3fc}main{height:calc(100vh - 54px);display:flex;flex-direction:column}section{padding:18px 24px;box-sizing:border-box}section:first-child{flex:0 0 auto;max-height:48%;min-height:0;overflow:auto}section:last-child{flex:1;min-height:0;padding-top:0;overflow:hidden}#question{white-space:pre-wrap;line-height:1.55;background:#171b22;padding:18px;border-radius:8px}#term{background:#050607;height:100%;box-sizing:border-box;padding:10px;overflow:hidden}.xterm,.xterm-viewport{height:100%!important}button,select{background:#2563eb;color:white;border:0;border-radius:5px;padding:9px 13px;cursor:pointer}button.secondary{background:#374151}button:disabled,select:disabled{opacity:.55;cursor:wait}#status{color:#9ca3af;margin:8px 0}#video{display:none;color:#7dd3fc;text-decoration:none;margin-left:10px}#video:hover{text-decoration:underline}#host{white-space:pre-wrap;background:#1c2635;border-left:3px solid #60a5fa;padding:10px 12px;margin:10px 0;line-height:1.5}dialog{background:#171b22;color:#e8eaed;border:1px solid #374151;border-radius:8px;min-width:420px}dialog::backdrop{background:#000a}#report-list{max-height:60vh;overflow:auto;white-space:pre-wrap;line-height:1.65}.pass{color:#86efac}.fail{color:#fca5a5}body.exam main{flex-direction:row}body.exam section:first-child{flex:0 0 34%;max-height:none;border-right:1px solid #374151;padding-right:16px}body.exam section:last-child{padding:18px;min-width:0}body.exam .training{display:none!important}
</style></head>
<body class="exam"><header><h1>CKA Exam Simulation</h1><select id="mode"><option value="exam">Exam Simulation</option><option value="practice">Practice Mode</option></select><button class="secondary" onclick="previous()">← Previous</button><select id="q"></select><button class="secondary" onclick="next()">Next →</button><button id="start-button" onclick="start()">Start Exam</button><button class="secondary training" onclick="validate()">Validate</button><button class="secondary training" onclick="hint()">Hint</button><button class="secondary training" onclick="showReport()">Report</button><span id="timer">02:00:00</span></header>
<main><section><h2 id="question-title">Task 1</h2><div id="status">Choose Start Exam to prepare Task 1.</div><div id="host">Context: base
Task host: controlplane
Connect with: ssh controlplane</div><a id="video" class="training" target="_blank" rel="noopener">Watch video</a><div id="question"></div></section><section><div id="term"></div></section></main>
<dialog id="report"><h2>Practice Report</h2><div id="report-list"></div><p><button onclick="document.querySelector('#report').close()">Close</button></p></dialog>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
let ws,started=false,preparing=false,seconds=0,hintLevel=0,progress={questions:{}},examStartedAt=0; const q=document.querySelector('#q'),mode=document.querySelector('#mode'),text=document.querySelector('#question'),status=document.querySelector('#status'),title=document.querySelector('#question-title'),video=document.querySelector('#video'),host=document.querySelector('#host'),startButton=document.querySelector('#start-button'),controls=[...document.querySelectorAll('header button, #q, #mode')];
const terminal=new Terminal({cursorBlink:true,fontSize:14,scrollback:5000,theme:{background:'#050607',foreground:'#e8eaed'}});const fitAddon=new FitAddon.FitAddon();terminal.loadAddon(fitAddon);terminal.open(document.querySelector('#term'));const fitTerminal=()=>{try{fitAddon.fit()}catch{}};requestAnimationFrame(fitTerminal);window.addEventListener('resize',fitTerminal);
for(let i=1;i<=17;i++)q.add(new Option('Question '+i,i));
q.addEventListener('change',()=>started?start():load());
mode.addEventListener('change',()=>{const exam=mode.value==='exam';document.body.classList.toggle('exam',exam);document.querySelector('h1').textContent=exam?'CKA Exam Simulation':'CKA Local Practice';startButton.textContent=exam?'Start Exam':'Reset Question';document.querySelector('#timer').textContent=exam?'02:00:00':'00:00:00';if(ws){ws.close();ws=null}started=false;seconds=0;examStartedAt=0;load();status.textContent=exam?'Choose Start Exam to prepare this task.':'Choose a question and press Reset Question.';terminal.reset();terminal.options.disableStdin=true;terminal.writeln('Terminal is not started. Prepare the task first.');requestAnimationFrame(fitTerminal)});
async function refreshProgress(){const r=await fetch('/api/progress');progress=await r.json();for(const option of q.options){const record=progress.questions?.[option.value];option.textContent=(record?.solved?'✓ ':'')+'Question '+option.value}}
async function load(){const r=await fetch('/api/question/'+q.value),d=await r.json();title.textContent=(mode.value==='exam'?d.title.replace('Question','Task'):d.title);text.textContent=d.text;host.textContent='Context: base\nTask host: '+d.target_host+'\nConnect with: ssh '+d.target_host;video.href=d.video_url||'';video.style.display=d.video_url&&mode.value==='practice'?'inline-block':'none';requestAnimationFrame(fitTerminal)}
function previous(){if(+q.value>1){q.value=+q.value-1;start()}}
function next(){if(+q.value<17){q.value=+q.value+1;start()}}
async function start(){if(preparing)return;preparing=true;controls.forEach(control=>control.disabled=true);if(ws){ws.close();ws=null}started=false;terminal.options.disableStdin=true;if(mode.value==='practice')seconds=0;if(mode.value==='exam'&&!examStartedAt)examStartedAt=Date.now();hintLevel=0;await load();terminal.reset();terminal.writeln('Preparing task environment…');terminal.writeln('Keyboard is locked while the VMs are resetting. This usually takes 30–90 seconds.');status.textContent='Preparing environment — keyboard locked (usually 30–90 seconds)…';try{const r=await fetch('/api/start/'+q.value,{method:'POST'}),d=await r.json();if(!d.ok){terminal.write(d.output);status.textContent='Preparation failed';return}terminal.reset();started=true;startButton.textContent=mode.value==='exam'?'Reset Task':'Reset Question';await refreshProgress();status.textContent=mode.value==='exam'?'Connected to base. Read the task, then ssh to the designated host.':'Solve independently. Use Validate after you finish.';const scheme=location.protocol==='https:'?'wss://':'ws://';const socket=new WebSocket(scheme+location.hostname+':8791');ws=socket;socket.onmessage=e=>terminal.write(e.data);socket.onopen=()=>{terminal.options.disableStdin=false;terminal.focus()};socket.onclose=()=>{if(ws===socket){ws=null;terminal.options.disableStdin=true;terminal.writeln('\r\nTerminal session ended. Reset the question to reconnect.');status.textContent='Terminal connection ended. Reset the question to reconnect.'}}}catch(error){terminal.writeln('\r\nCould not prepare the question.');status.textContent='Preparation failed. Try again.'}finally{preparing=false;controls.forEach(control=>control.disabled=false)}}
terminal.onData(data=>{if(ws&&ws.readyState===1)ws.send(data)});
terminal.attachCustomKeyEventHandler(event=>{const key=event.key.toLowerCase();if(event.ctrlKey&&!event.shiftKey&&key==='v')return false;if(event.ctrlKey&&event.shiftKey&&key==='v'){navigator.clipboard.readText().then(value=>{if(ws&&ws.readyState===1)ws.send(value)}).catch(()=>{});return false}if(event.ctrlKey&&event.shiftKey&&key==='c'){navigator.clipboard.writeText(terminal.getSelection()).catch(()=>{});return false}return true});
async function validate(){if(!started||preparing)return;preparing=true;controls.forEach(control=>control.disabled=true);status.textContent='Checking your solution…';terminal.writeln('\r\nRunning validator…');try{const r=await fetch('/api/validate/'+q.value,{method:'POST'}),d=await r.json();terminal.writeln(d.output);progress=d.progress||progress;await refreshProgress();status.innerHTML=d.ok?'<span class="pass">Passed — this question is recorded as solved.</span>':'<span class="fail">Not passed yet. Review the validator output above.</span>'}catch{status.textContent='Validation could not run. Check the terminal connection.'}finally{preparing=false;controls.forEach(control=>control.disabled=false)}}
async function hint(){if(!started)return;hintLevel++;const r=await fetch('/api/hint/'+q.value+'/'+hintLevel);const d=await r.json();terminal.writeln('\r\nHint '+hintLevel+':\r\n'+d.hint)}
function formatTime(value){if(value===undefined)return '—';const m=String(Math.floor(value/60)).padStart(2,'0'),s=String(value%60).padStart(2,'0');return m+':'+s}
async function showReport(){await refreshProgress();const rows=[];for(let i=1;i<=17;i++){const r=progress.questions?.[i];const state=r?.solved?'Solved':'Not solved';const marker=r?.solved?'✓':'•';rows.push(`${marker} Question ${i}: ${state} | Attempts: ${r?.attempts||0} | Best time: ${formatTime(r?.best_time_seconds)}`)}document.querySelector('#report-list').textContent=rows.join('\n');document.querySelector('#report').showModal()}
setInterval(()=>{if(!started)return;if(mode.value==='exam'){const left=Math.max(0,7200-Math.floor((Date.now()-examStartedAt)/1000)),h=String(left/3600|0).padStart(2,'0'),m=String(left/60%60|0).padStart(2,'0'),s=String(left%60).padStart(2,'0');document.querySelector('#timer').textContent=`${h}:${m}:${s}`}else{seconds++;const h=String(seconds/3600|0).padStart(2,'0'),m=String(seconds/60%60|0).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.querySelector('#timer').textContent=`${h}:${m}:${s}`}},1000);terminal.options.disableStdin=true;load().then(()=>terminal.writeln('Terminal is not started. Press Start Exam to prepare the task.'));
</script></body></html>
